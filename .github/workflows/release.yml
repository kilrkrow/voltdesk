name: Release

# Single release path for VoltDesk ("release spine").
#   git tag v1.2.3 && git push origin v1.2.3
# builds Release on windows-latest with build/release.ps1 (the same script used
# locally), attaches VoltDesk-win-x64-<tag>.zip + .zip.sha256 to a GitHub
# release, packs and install-tests the Chocolatey package, and pushes it to
# the Chocolatey community feed only for a real release.
#
# Safety gates for the Chocolatey push (all must hold, otherwise it is skipped
# with a log line saying why):
#   - tag has no '-' (v1.2.3-rc.1, v0.0.0-test etc. are prereleases: the
#     GitHub release is created as a DRAFT prerelease and nothing is pushed)
#   - the run is in kilrkrow/voltdesk itself (not a fork)
#   - the repository is public
#   - the CHOCOLATEY_API_KEY secret exists

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CANONICAL_REPO: kilrkrow/voltdesk
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  release:
    name: Build, release, package
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(?:\.\d+)?)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Tag '$env:TAG' is not a release tag like v1.2.3 or v1.2.3-rc.1"
          }
          $isPrerelease = $env:TAG.Contains('-')
          $isCanonical = $env:REPO -eq $env:CANONICAL_REPO
          $isPublic = $env:REPO_PRIVATE -eq 'false'
          Write-Host "tag=$env:TAG prerelease=$isPrerelease canonical_repo=$isCanonical public=$isPublic"
          Add-Content $env:GITHUB_OUTPUT -Encoding ascii -Value @(
            "tag=$env:TAG",
            "version=$($env:TAG.Substring(1))",
            "prerelease=$($isPrerelease.ToString().ToLowerInvariant())",
            "canonical=$($isCanonical.ToString().ToLowerInvariant())",
            "public=$($isPublic.ToString().ToLowerInvariant())")

      - name: Build and zip (build/release.ps1)
        id: build
        run: ./build/release.ps1 -Version '${{ steps.meta.outputs.tag }}'

      - name: Verify sha256 file matches zip
        env:
          ZIP: ${{ steps.build.outputs.zip }}
          SHA_FILE: ${{ steps.build.outputs.sha256_file }}
        run: |
          $expected = ((Get-Content -LiteralPath $env:SHA_FILE -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $env:ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "sha256 mismatch: file says $expected, zip is $actual" }
          Write-Host "sha256 OK: $actual"

      - name: Create GitHub release and attach zip + sha256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          ZIP: ${{ steps.build.outputs.zip }}
          SHA_FILE: ${{ steps.build.outputs.sha256_file }}
        run: |
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; uploading assets to it."
            gh release upload $env:TAG $env:ZIP $env:SHA_FILE --clobber
          } else {
            $releaseArgs = @('release', 'create', $env:TAG, $env:ZIP, $env:SHA_FILE,
                             '--verify-tag', '--title', "VoltDesk $env:TAG", '--generate-notes')
            if ($env:PRERELEASE -eq 'true') {
              Write-Host "Prerelease/test tag: creating a DRAFT prerelease (not public)."
              $releaseArgs += @('--draft', '--prerelease')
            }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }

      - name: Build Inno Setup installer
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "innosetup install failed" }
          }
          & $iscc "/DAppVersion=$env:VERSION" VoltDeskInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Pack Chocolatey package (build/choco-pack.ps1)
        id: pack
        run: ./build/choco-pack.ps1 -Version '${{ steps.meta.outputs.tag }}' -Installer Output/VoltDeskSetup.exe

      - name: Validate Chocolatey package (install, check, uninstall, check)
        env:
          PKG_DIR: ${{ steps.pack.outputs.package_dir }}
          PKG_VERSION: ${{ steps.pack.outputs.package_version }}
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\VoltDesk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\VoltDesk_is1'
          $startupLnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'VoltDesk.lnk'

          choco install voltdesk --source $env:PKG_DIR --version $env:PKG_VERSION --pre --ignore-dependencies -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install failed with exit code $LASTEXITCODE" }
          foreach ($f in @('VoltDesk.exe', 'VoltDesk.dll', 'appicon.ico')) {
            if (-not (Test-Path (Join-Path $appDir $f))) { throw "after install: $appDir\$f is missing" }
          }
          if (-not (Test-Path $uninstallKey)) { throw "after install: $uninstallKey is missing" }
          Write-Host "install OK: $appDir"

          choco uninstall voltdesk -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed with exit code $LASTEXITCODE" }
          $left = @()
          if (Test-Path (Join-Path $appDir 'VoltDesk.exe')) { $left += "$appDir\VoltDesk.exe" }
          if (Test-Path $uninstallKey) { $left += $uninstallKey }
          if (Test-Path $startupLnk) { $left += $startupLnk }
          if ($left.Count) { throw "after uninstall, leftovers: $($left -join ', ')" }
          Write-Host "uninstall OK: no leftovers"

      - name: Upload Chocolatey package as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltdesk-nupkg-${{ steps.meta.outputs.tag }}
          path: ${{ steps.pack.outputs.nupkg }}
          if-no-files-found: error
          retention-days: 14

      - name: Push to Chocolatey community feed (gated)
        env:
          CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          CANONICAL: ${{ steps.meta.outputs.canonical }}
          PUBLIC: ${{ steps.meta.outputs.public }}
        run: |
          $skip = @()
          if ($env:PRERELEASE -ne 'false') { $skip += "tag is a prerelease/test tag" }
          if ($env:CANONICAL -ne 'true') { $skip += "run is not in $env:CANONICAL_REPO" }
          if ($env:PUBLIC -ne 'true') { $skip += "repository is not public" }
          if ([string]::IsNullOrEmpty($env:CHOCO_KEY)) { $skip += "secret CHOCOLATEY_API_KEY is not set" }
          if ($skip.Count) {
            Write-Host "Chocolatey push SKIPPED: $($skip -join '; '). Package was packed and validated: $env:NUPKG"
            exit 0
          }
          Write-Host "Pushing $env:NUPKG to https://push.chocolatey.org/"
          choco push $env:NUPKG --source https://push.chocolatey.org/ --api-key $env:CHOCO_KEY
          if ($LASTEXITCODE -ne 0) { throw "choco push failed with exit code $LASTEXITCODE" }
