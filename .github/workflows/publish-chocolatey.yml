name: Publish to Chocolatey

on:
  release:
    types: [published]

jobs:
  publish-chocolatey:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set package version
        id: package-version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore voltdesk.sln

      - name: Build release
        run: dotnet build voltdesk.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish PowerDesktopApp.csproj -c Release -o publish --no-build

      - name: Download Inno Setup Compiler
        run: |
          choco install innosetup -y
          
      - name: Build Inno Setup installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.package-version.outputs.version }}" "VoltDeskInstaller.iss"

      - name: Create Chocolatey package structure
        run: |
          mkdir -p choco-pkg\tools
          Copy-Item -Path "Output\VoltDeskSetup.exe" -Destination "choco-pkg\tools\"
          Copy-Item -Path "LICENSE" -Destination "choco-pkg\tools\LICENSE.txt"

          $installerHash = (Get-FileHash "choco-pkg\tools\VoltDeskSetup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          VERIFICATION
          Verification is intended to assist the Chocolatey moderators and community
          in verifying that this package's embedded binaries are trustworthy.

          The embedded installer is built from source by the GitHub Actions workflow
          for the release tag and then packaged without downloading third-party
          application binaries.

          Package: voltdesk
          Version: ${{ steps.package-version.outputs.version }}
          Embedded file: tools\VoltDeskSetup.exe
          SHA256: $installerHash

          Source: https://github.com/kilrkrow/voltdesk/tree/${{ github.ref_name }}
          Release: https://github.com/kilrkrow/voltdesk/releases/tag/${{ github.ref_name }}
          Workflow: https://github.com/kilrkrow/voltdesk/actions/workflows/publish-chocolatey.yml
          "@ | Out-File -Encoding UTF8 "choco-pkg\tools\VERIFICATION.txt"

      - name: Create nuspec file
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>voltdesk</id>
              <version>${{ steps.package-version.outputs.version }}</version>
              <title>VoltDesk</title>
              <authors>kilrkrow</authors>
              <description>Windows desktop application for quick system access and power management</description>
              <projectUrl>https://github.com/kilrkrow/voltdesk</projectUrl>
              <packageSourceUrl>https://github.com/kilrkrow/voltdesk</packageSourceUrl>
              <projectSourceUrl>https://github.com/kilrkrow/voltdesk</projectSourceUrl>
              <bugTrackerUrl>https://github.com/kilrkrow/voltdesk/issues</bugTrackerUrl>
              <docsUrl>https://github.com/kilrkrow/voltdesk#readme</docsUrl>
              <iconUrl>https://cdn.jsdelivr.net/gh/kilrkrow/voltdesk@master/appicon.ico</iconUrl>
              <licenseUrl>https://github.com/kilrkrow/voltdesk/blob/master/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <tags>system-access power-management windows-desktop</tags>
              <summary>Quick system access and power management for Windows</summary>
              <releaseNotes>https://github.com/kilrkrow/voltdesk/releases/tag/${{ github.ref_name }}</releaseNotes>
              <dependencies>
                <dependency id="dotnet-10.0-desktopruntime" version="[10.0.0,11.0.0)" />
              </dependencies>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          '@ | Out-File -Encoding UTF8 "choco-pkg\voltdesk.nuspec"

      - name: Create chocolateyInstall.ps1
        run: |
          @'
          $packageName = 'voltdesk'
          $toolsDir = "$(Split-Path -parent $MyInvocation.MyCommand.Definition)"
          $installerPath = Get-ChildItem $toolsDir -Filter "*VoltDesk*.exe" | Select-Object -First 1 -ExpandProperty FullName

          if (-not $installerPath) {
            throw "VoltDesk installer not found in tools directory"
          }

          $silentArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'

          $process = Start-Process -FilePath $installerPath -ArgumentList $silentArgs -Wait -NoNewWindow -PassThru
          $validExitCodes = @(0, 3010)
          if ($validExitCodes -notcontains $process.ExitCode) {
            throw "VoltDesk installer failed with exit code $($process.ExitCode)"
          }
          '@ | Out-File -Encoding UTF8 "choco-pkg\tools\chocolateyInstall.ps1"

      - name: Create chocolateyUninstall.ps1
        run: |
          @'
          $packageName = 'voltdesk'
          $installDir = Join-Path $env:ProgramFiles 'VoltDesk'

          if (Test-Path $installDir) {
            $uninstallerPath = Get-ChildItem $installDir -Filter "*uninstall*.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
            
            if ($uninstallerPath) {
              $process = Start-Process -FilePath $uninstallerPath -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -NoNewWindow -PassThru
              $validExitCodes = @(0, 3010)
              if ($validExitCodes -notcontains $process.ExitCode) {
                throw "VoltDesk uninstaller failed with exit code $($process.ExitCode)"
              }
            }
          }
          '@ | Out-File -Encoding UTF8 "choco-pkg\tools\chocolateyUninstall.ps1"

      - name: Pack Chocolatey package
        run: |
          cd choco-pkg
          choco pack voltdesk.nuspec

      - name: Test package locally
        run: |
          cd choco-pkg
          choco install voltdesk -s . -y --ignore-dependencies

      - name: Publish to Chocolatey
        run: |
          cd choco-pkg
          choco push voltdesk.${{ steps.package-version.outputs.version }}.nupkg --source https://push.chocolatey.org/ --key=${{ secrets.CHOCOLATEY_API_KEY }}
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  # Deliberately independent of publish-chocolatey (no `needs:`): a Chocolatey
  # push or moderation failure must never again leave a release with no assets.
  release-assets:
    name: Upload release assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore voltdesk.sln

      - name: Build release
        run: dotnet build voltdesk.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish PowerDesktopApp.csproj -c Release -o publish --no-build

      - name: Verify publish output is a runnable app
        run: |
          foreach ($required in @('VoltDesk.exe', 'VoltDesk.dll', 'VoltDesk.runtimeconfig.json')) {
            if (-not (Test-Path "publish\$required")) { throw "publish\$required is missing" }
          }
          $count = (Get-ChildItem publish -Recurse -File).Count
          Write-Host "publish output contains $count files"
          if ($count -lt 100) { throw "publish output has only $count files; expected the full self-contained set" }

      - name: Create release archive
        run: Compress-Archive -Path "publish\*" -DestinationPath "VoltDesk-win-x64-${{ github.ref_name }}.zip" -Force

      - name: Upload release archive
        run: gh release upload "${{ github.ref_name }}" "VoltDesk-win-x64-${{ github.ref_name }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
